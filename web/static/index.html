<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>主席模拟器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <!-- 页面容器 -->
    <div class="pages">

        <!-- 首页 -->
        <div class="page active" id="page-home">
            <div class="home-hero">
                <div class="home-portrait">📖</div>
                <h2>和老人家聊聊</h2>
                <p>毛泽东选集 · 文集 · 诗词 · 建国后文稿 · 406 篇</p>
            <p class="home-stat">目前知识库总量：145 万字</p>
                <button class="home-enter" onclick="showEntryPanel()">和老人家聊聊</button>
            </div>
            <div class="hotspot-panel" id="hotspotPanel">
                <div class="hotspot-header"><span>🔥 今日热议</span><span class="hotspot-source">百度热搜</span></div>
                <div class="hotspot-list" id="hotspotList">加载中...</div>
            </div>
            <div class="home-topics" id="topicSection">
                <h3>💬 试试这些</h3>
                <div class="topic-list" id="topicList"></div>
            </div>
            <div class="home-links">
                <span onclick="openLogs()">📋 聊天日志</span>
            </div>
        </div>

        <!-- 聊天页 -->
        <div class="page" id="page-chat">
            <div class="stats-bar" id="stats">📊 等待对话...</div>
            <div class="fatigue-bar green" id="fatigueBar">🟢 精神饱满</div>
            <div class="compact-btns" id="compactBtns" style="display:none">
                <button onclick="doCompact()">🍵 续茶</button>
                <button onclick="doCompact()">🚬 递烟</button>
            </div>
            <div class="chat-links"><span onclick="openLogs()">📋 聊天日志</span></div>
            <div class="chat-messages" id="chat"></div>
            <div class="chat-input">
                <textarea id="msg" placeholder="随便问点什么..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
                <button id="sendBtn" onclick="send()">发送</button>
            </div>
        </div>

        <!-- 阅读页 -->
        <div class="page" id="page-read">
            <div class="reader-nav"><span onclick="showCatalogView()">📚 著作目录</span></div>
            <div class="catalog-view" id="catalogView">加载中...</div>
            <div class="reader-view" id="readerView" style="display:none">
                <div class="reader-header" id="readerTitle"></div>
                <div class="reader-content" id="readerContent"></div>
            </div>
        </div>

    </div>

    <!-- 底部标签栏 -->
    <nav class="tab-bar">
        <div class="tab active" onclick="switchTab('home')" id="tab-home">
            <span class="tab-icon">🏠</span><span class="tab-label">首页</span>
        </div>
        <div class="tab" onclick="switchTab('chat')" id="tab-chat">
            <span class="tab-icon">💬</span><span class="tab-label">聊天</span>
        </div>
        <div class="tab" onclick="switchTab('read')" id="tab-read">
            <span class="tab-icon">📚</span><span class="tab-label">阅读</span>
        </div>
    </nav>
    <!-- 热点弹窗 -->
    <div class="hot-modal" id="hotModal" style="display:none">
        <div class="hot-modal-content">
            <div class="hot-modal-title" id="hotModalTitle"></div>
            <div class="hot-modal-brief" id="hotModalBrief">加载中...</div>
            <div class="hot-modal-btns">
                <button onclick="chatAboutHot()">💬 和主席聊聊这个</button>
                <button onclick="closeHotModal()">👀 看看别的</button>
                <button onclick="closeHotModal()">🏠 回到首页</button>
            </div>
        </div>
    </div>
    <div class="log-panel" id="logPanel" style="display:none"></div>
    <!-- 入口选择弹窗 -->
    <div class="modal-overlay" id="entryModal" style="display:none">
        <div class="modal-content">
            <h3>📖 开始对话</h3>
            <div id="entryOptions"></div>
        </div>
    </div>
    <!-- 退出确认弹窗 -->
    <div class="modal-overlay" id="exitModal" style="display:none">
        <div class="modal-content">
            <h3>退出聊天</h3>
            <p style="font-size:14px;color:var(--text-light);margin-bottom:16px">当前对话有 {{rounds}} 轮，是否保存？</p>
            <div class="modal-btns">
                <button onclick="exitAndSave()">💾 保存并返回</button>
                <button onclick="exitAndDiscard()">🗑 不保存并返回</button>
                <button onclick="closeExitModal()">↩ 继续聊天</button>
            </div>
        </div>
    </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
