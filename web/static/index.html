<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主席模拟器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <header class="header">
        <h1>📖 主席模拟器</h1>
        <div class="header-right">
            <button class="rest-btn" onclick="restChairman()" title="让主席休息">💤</button>
            <button class="log-btn" onclick="toggleLogs()" title="对话日志">📋</button>
            <span id="status">● 就绪</span>
        </div>
    </header>
    <div class="stats-bar" id="stats">📊 等待对话...</div>
    <div class="fatigue-bar green" id="fatigueBar">🟢 精神饱满</div>
    <div class="compact-btns" id="compactBtns" style="display:none">
        <button onclick="doCompact()">🍵 给主席续一杯茶</button>
        <button onclick="doCompact()">🚬 给主席递一根烟</button>
    </div>
    <main class="chat" id="chat">
        <div class="welcome" id="welcome">
            <h2>📚 和老先生聊聊</h2>
            <p>基于毛泽东选集四卷 · 像朋友聊天一样交流</p>
            <div class="suggestions">
                <button onclick="ask('怎么才能看清一件事的本质？')">怎么看清一件事的本质？</button>
                <button onclick="ask('遇到难题拿不定主意怎么办？')">遇到难题拿不定主意怎么办？</button>
                <button onclick="ask('怎么判断谁是朋友谁是敌人？')">怎么判断谁是朋友谁是敌人？</button>
            </div>
            <div class="inline-input">
                <textarea id="msg" placeholder="随便问点什么..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
                <button id="sendBtn" onclick="send()">发送</button>
            </div>
        </div>
    </main>
    <div class="log-panel" id="logPanel" style="display:none"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
