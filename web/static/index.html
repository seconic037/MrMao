<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主席模拟器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <header class="header">
        <h1>📖 主席模拟器</h1>
        <div class="header-right">
            <button class="rest-btn" onclick="restChairman()" title="让主席休息">💤</button>
            <button class="log-btn" onclick="toggleLogs()" title="对话日志">📋</button>
            <span id="status">● 就绪</span>
        </div>
    </header>
    <div class="stats-bar" id="stats" style="display:none">📊 等待对话...</div>
    <div class="fatigue-bar green" id="fatigueBar" style="display:none">🟢 精神饱满</div>
    <div class="compact-btns" id="compactBtns" style="display:none">
        <button onclick="doCompact()">🍵 给主席续一杯茶</button>
        <button onclick="doCompact()">🚬 给主席递一根烟</button>
    </div>

    <!-- 门面层 -->
    <div class="cover" id="cover">
        <div class="cover-inner">
            <div class="cover-portrait">📖</div>
            <h2>和老人家聊聊</h2>
            <p>毛泽东选集 · 文集 · 诗词 · 建国后文稿 · 406 篇</p>
            <button class="cover-enter" onclick="enterChat()">和老人家聊聊</button>
        </div>

        <!-- 热点区块（独立区域） -->
        <div class="hotspot-panel" id="hotspotPanel">
            <div class="hotspot-header">
                <span>🔥 今日热议</span>
                <span class="hotspot-source">来源：百度热搜</span>
            </div>
            <div class="hotspot-list" id="hotspotList">加载中...</div>
        </div>

        <div class="cover-inner">
            <div class="cover-section" id="topicSection">
                <h3>💬 试试这些话题</h3>
                <div class="topic-list" id="topicList"></div>
            </div>

            <div class="cover-section">
                <h3>📚 阅读著作 <span class="catalog-toggle" onclick="toggleCatalog()">展开</span></h3>
                <div class="catalog" id="catalog" style="display:none"></div>
                <div class="reader" id="reader" style="display:none">
                    <div class="reader-header">
                        <span class="reader-back" onclick="closeReader()">← 返回</span>
                        <span id="readerTitle"></span>
                    </div>
                    <div class="reader-content" id="readerContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 聊天区（初始隐藏） -->
    <div class="chat-app" id="chatApp" style="display:none">
        <main class="chat-messages" id="chat"></main>
        <footer class="chat-input">
            <textarea id="msg" placeholder="随便问点什么..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
            <button id="sendBtn" onclick="send()">发送</button>
        </footer>
    </div>
    <div class="log-panel" id="logPanel" style="display:none"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
